<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
<h1>Регистрация</h1>
{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}
<form method="POST">
    <p>Имя:</p>
    <input type="text" name="name">
    <p>Email:</p>
    <input type="text" name="email">
    <p>Пароль:</p>
    <input type="password" name="password">
    <button type="submit">Зарегистрироваться</button>
</form>
<a href="/login">Вход</a>
</body>
</html>
